<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <!-- Подключаем SDK Telegram и Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://sad.adsgram.ai"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { padding: 15px 25px; font-size: 18px; cursor: pointer; background: #2481cc; color: white; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Добро пожаловать в Mini App!</h1>
    <p>Нажми на кнопку, чтобы посмотреть рекламу:</p>
    <button onclick="showAd()">Посмотреть рекламу 📺</button>

    <script>
        // Инициализация Adsgram (замени blockId на свой из личного кабинета)
        const AdController = window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" });

        async function showAd() {
            try {
                const result = await AdController.show();
                alert("Спасибо за просмотр! Вы получили бонус.");
            } catch (error) {
                console.error(error);
                alert("Реклама не загрузилась или была пропущена.");
            }
        }
        
        // Сообщаем Telegram, что приложение готово
        window.Telegram.WebApp.ready();
    </script>
</body>
</html>
